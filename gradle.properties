# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Do not keep Gradle/Kotlin daemons resident after a build:
# 构建结束即退出，避免常驻守护进程占用大量内存。
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process

# Android settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin settings
kotlin.code.style=official
# Compose codegen over the ~2900-line ChatScreen and its peers does not fit the
# default daemon heap; without this the Kotlin worker dies with an OOM mid-build.
kotlin.daemon.jvmargs=-Xmx4096m

